# Task 6: Build a CI workflow that runs on pull requests and pushes to main.
#
# See the assignment chapter for the required steps and commands.
# Fill in the TODO values below.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Test
        env:
          API_KEY: test-key-123
        run: pytest tests -q
      - name: Build image
        run: docker build -t halyna1995-pipeline:${{ github.sha }} .
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name hyfregistry

      - name: Push image
        run: |
          docker tag halyna1995-pipeline:${{ github.sha }} hyfregistry.azurecr.io/halyna1995-pipeline:${{ github.sha }}
          docker push hyfregistry.azurecr.io/halyna1995-pipeline:${{ github.sha }}